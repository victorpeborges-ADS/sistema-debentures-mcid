services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G

  app:
    build: .
    ports:
      - "8502:8502"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - APP_PASSWORD=${APP_PASSWORD:-}
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
